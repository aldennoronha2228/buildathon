<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 565 877" role="img" aria-labelledby="title desc">
  <title id="title">SaudaSakshi voice agreement screen</title>
  <desc id="desc">The voice agreement screen with language detection, microphone recording, transcript entry, and agreement generation.</desc>
  <rect width="565" height="877" fill="#f7f7f7"/>
  <rect x="0.5" y="0.5" width="564" height="876" fill="none" stroke="#d4d4d4"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <!-- App header -->
    <rect x="22" y="21" width="43" height="43" rx="21.5" fill="#ededed" stroke="#d6d6d6"/>
    <path d="M35 35h17M35 42h17M35 49h17" stroke="#161616" stroke-width="2" stroke-linecap="round"/>
    <text x="77" y="48" font-size="18" font-weight="700" letter-spacing="-.6">SaudaSakshi</text>
    <circle cx="308" cy="42" r="21" fill="#f1f1f1" stroke="#d5d5d5"/>
    <path d="M309 30a12 12 0 1 0 11 18 10 10 0 0 1-11-18Z" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="360" cy="42" r="21" fill="#f1f1f1" stroke="#d5d5d5"/>
    <path d="M352 48h16l-2-3v-4a6 6 0 0 0-12 0v4Z" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M358 50a2 2 0 0 0 4 0M372 34l3 3-3 3" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="392" y="24" width="144" height="37" rx="18.5" fill="#efefef" stroke="#d5d5d5"/>
    <g stroke="#111" stroke-width="1.8" stroke-linecap="round">
      <path d="M413 38v8M418 35v14M423 38v8M428 40v4"/>
    </g>
    <text x="435" y="47" font-size="14" font-weight="700" letter-spacing="-.4">Auto-Detect</text>
    <line x1="0" y1="79" x2="565" y2="79" stroke="#dedede"/>
    <!-- Progress -->
    <text x="27" y="107" font-size="15" font-weight="700">1. Voice</text>
    <text x="200" y="107" font-size="15" font-weight="600" fill="#737373">2. Confirm</text>
    <text x="373" y="107" font-size="15" font-weight="600" fill="#737373">3. Pay</text>
    <rect x="27" y="120" width="163" height="5" rx="2.5" fill="#111"/>
    <rect x="200" y="120" width="163" height="5" rx="2.5" fill="#d7d7d7"/>
    <rect x="373" y="120" width="163" height="5" rx="2.5" fill="#d7d7d7"/>
    <line x1="0" y1="143" x2="565" y2="143" stroke="#dedede"/>
    <!-- Voice entry -->
    <text x="282.5" y="218" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="-.9">From Verbal Agreements</text>
    <text x="282.5" y="255" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="-.9">to Verified Payments.</text>
    <rect x="73" y="285" width="419" height="34" rx="17" fill="#eeeeee" stroke="#dadada"/>
    <circle cx="92" cy="302" r="3.5" fill="#111"/>
    <text x="105" y="307" font-size="14" font-weight="600" fill="#666">Auto-Detect · Speak in Kannada, Hindi, Tamil, or English</text>
    <circle cx="282.5" cy="418" r="59" fill="#eeeeee" stroke="#d5d5d5"/>
    <rect x="277" y="400" width="11" height="27" rx="5.5" fill="none" stroke="#111" stroke-width="3"/>
    <path d="M270 418v3a12.5 12.5 0 0 0 25 0v-3M282.5 434v8M276 442h13" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
    <circle cx="146" cy="513" r="5" fill="#d8d8d8"/>
    <text x="161" y="519" font-size="15" font-weight="600" fill="#666">Enter an agreement transcript below</text>
    <rect x="28" y="563" width="508" height="209" rx="20" fill="#eeeeee" stroke="#d5d5d5"/>
    <text x="54" y="604" font-size="13" font-weight="700" letter-spacing=".4" fill="#666">VOICE TRANSCRIPT</text>
    <text x="54" y="645" font-size="17" fill="#aaa">Speak naturally in Kannada, Hindi, Tamil, or English...</text>
    <text x="54" y="672" font-size="17" fill="#aaa">the transcript appears here. You can also type directly.</text>
    <rect x="28" y="822" width="508" height="55" rx="15" fill="#b3b3b3"/>
    <text x="282" y="857" text-anchor="middle" font-size="16" font-weight="600" fill="#f7f7f7">Generate Agreement  →</text>
  </g>
</svg>
