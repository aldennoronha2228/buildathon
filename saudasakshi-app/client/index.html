<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Turn verbal work agreements into structured, verified payment contracts. Speak in Kannada, Hindi, Tamil or English; collect advances and balances over Cashfree."
    />
    <meta name="theme-color" content="#09090B" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2309090B'/%3E%3Cpath d='M9 16.5l5 5 9-11' stroke='%23FFFFFF' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>SaudaSakshi — From Verbal Agreements to Verified Payments</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Surface boot-time crashes visibly instead of a blank screen
      window.addEventListener("error", function (e) {
        var el = document.createElement("pre");
        el.id = "boot-error";
        el.style.cssText = "color:#f87171;padding:16px;font:12px monospace;white-space:pre-wrap";
        el.textContent = "Boot error: " + e.message + (e.error && e.error.stack ? "\n" + e.error.stack : "");
        document.body.appendChild(el);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
